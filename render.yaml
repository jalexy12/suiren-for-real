services:
  # Agent API (Bun + Hono)
  - type: web
    name: suiren-agent
    runtime: docker
    dockerfilePath: ./apps/agent/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: agentfs-data
      mountPath: /app/apps/agent/.agentfs
      sizeGB: 1
    envVars:
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CONVEX_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: NODE_ENV
        value: production

  # Web Frontend (TanStack Start SSR)
  - type: web
    name: suiren-web
    runtime: node
    buildCommand: bun install && cd apps/web && npx vite build
    startCommand: cd apps/web && node server.mjs
    envVars:
      - key: VITE_CONVEX_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_AGENT_URL
        sync: false
      - key: CONVEX_DEPLOY_KEY
        sync: false
      - key: NODE_ENV
        value: production
